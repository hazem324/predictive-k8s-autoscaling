apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-controller-sa
  namespace: task-flow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-controller-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-controller-binding
subjects:
- kind: ServiceAccount
  name: ai-controller-sa
  namespace: task-flow
roleRef:
  kind: ClusterRole
  name: ai-controller-role
  apiGroup: rbac.authorization.k8s.io