apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: taskflow-backend

  template:
    metadata:
      labels:
        app: taskflow-backend

    spec:
      containers:
        - name: backend
          image: hazem231/todo-backend:latest

          ports:
            - containerPort: 8090

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://db-service:3306/todo

            - name: SPRING_DATASOURCE_USERNAME
              value: appuser

            - name: SPRING_DATASOURCE_PASSWORD
              value: apppass

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "1000m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 8090
            initialDelaySeconds: 20
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 20